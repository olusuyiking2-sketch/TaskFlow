<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - TaskFlow</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


    <nav class="navbar">

        <div class="logo">
            TaskFlow
        </div>


        <div class="nav-links">

            <a href="/">
                Home
            </a>


            <a href="/register">
                Create Account
            </a>

        </div>

    </nav>



    <div class="auth-container glass">


        <h1>
            Login
        </h1>



        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}




        <form method="POST" class="auth-form">

         <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


            <input 
                type="email"
                name="email"
                placeholder="Email"
                required
            >



            <input 
                type="password"
                name="password"
                placeholder="Password"
                required
            >



            <button type="submit">
                Login
            </button>


        </form>



        <p style="margin-top:20px; text-align:center; color:var(--secondary-text);">

            Don't have an account?

            <a href="/register" style="color:var(--primary);">
                Create free account
            </a>

        </p>



    </div>



</body>

</html>
