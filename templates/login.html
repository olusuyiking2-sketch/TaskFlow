<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Login</h1>

    {% with messages = get_flashed_messages() %}

{% for message in messages %}

<p class="message">
    {{ message }}
</p>

{% endfor %}

{% endwith %}

    <form method="POST">

        <input type="hidden" name="csrf_token" value="{{ csrf_token()}}">

        <input 
            type="email" 
            name="email" 
            placeholder="Email"
            required
        >

        <br>

        <input 
            type="password" 
            name="password" 
            placeholder="Password"
            required
        >

        <br>

        <button type="submit">
            Login
        </button>

    </form>


    <p>
        Don't have an account?
        <a href="/register">Register</a>
    </p>


</body>
</html>
