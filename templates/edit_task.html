<h2>Edit Task</h2>

<form method="POST">

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <input 
        type="text" 
        name="title" 
        value="{{ task[2] }}"
    >

    <textarea name="description">{{ task[3] }}</textarea>

    <button type="submit">
        Save Changes
    </button>

</form>
